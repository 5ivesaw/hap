<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 196"><style>
.tear{animation:drop 1.1s ease-out 3;transform-box:fill-box;transform-origin:center}
.tear.right{animation-delay:.17s}
.spark{animation:flash 1.25s ease-in-out 3}
@keyframes drop{0%,100%{transform:translateY(0);opacity:1}45%{transform:translateY(8px) rotate(8deg);opacity:.8}}
@keyframes flash{50%{opacity:.28}}
@media (prefers-reduced-motion:reduce){.tear,.spark{animation:none}}
</style>
<rect x="1" y="1" width="878" height="194" rx="22" fill="#291a36" stroke="#885d86"/>
<text x="32" y="42" font-family="monospace" letter-spacing="2" font-size="13" fill="#ffc76f">PLAYTEST / 01</text>
<text x="30" y="101" font-family="system-ui, sans-serif" font-size="47" font-weight="800" fill="#fff1d9">First Waypoint</text>
<text x="32" y="149" font-family="system-ui, sans-serif" font-size="18" fill="#e4bdcf">Take control → Reach the marker → Hand back control</text>
<rect x="615" y="20" width="245" height="156" rx="15" fill="#392545" stroke="#ad7194" stroke-dasharray="4 5"/>
<circle class="spark" cx="737" cy="81" r="27" fill="none" stroke="#ff9cb9" stroke-width="2"/>
<path d="M730 70l17 11-17 11z" fill="#ff9cb9"/>
<text x="737" y="137" text-anchor="middle" font-family="monospace" letter-spacing="2" font-size="12" fill="#ffbdd0">REPLAY PENDING</text></svg>
