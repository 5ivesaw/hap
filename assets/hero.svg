<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330"><style>
.tear{animation:drop 1.1s ease-out 3;transform-box:fill-box;transform-origin:center}
.tear.right{animation-delay:.17s}
.spark{animation:flash 1.25s ease-in-out 3}
.mascot{animation:bounce 1.25s ease-in-out 3}
@keyframes bounce{40%{transform:translateY(-5px)}}
@keyframes drop{0%,100%{transform:translateY(0);opacity:1}45%{transform:translateY(8px) rotate(8deg);opacity:.8}}
@keyframes flash{50%{opacity:.28}}
@media (prefers-reduced-motion:reduce){.tear,.spark,.mascot{animation:none}}
</style>
<defs>
 <pattern id="dot" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#956688" opacity=".38"/></pattern>
 <linearGradient id="gold" x2=".85" y2="1" gradientUnits="objectBoundingBox"><stop stop-color="#fff091"/><stop offset="1" stop-color="#ffac53"/></linearGradient>
</defs>
<rect x="1" y="1" width="878" height="328" rx="26" fill="#21142e" stroke="#956688"/>
